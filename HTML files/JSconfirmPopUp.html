<html>
    <head>
        <title>JavaScript Confirm Pop up Box</title>
    </head>
    <body>
        <script type="text/javascript">
            var response;
            if(confirm("press a button!")){
                response="You pressed OK!";
            }
            else{
                response="You pressed Cancel!";
            }
            document.write(response);
        </script>
    </body>
</html>
