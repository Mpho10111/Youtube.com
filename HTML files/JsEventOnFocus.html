<!DOCTYPE html>
<html>

        <title> Example of onFocus event handler</title>

        Click your mouse in the text box :<br/>

            <input type=" text" name="data " value="" size="10 " onFocus="alert('You focused the textbook!!')">
        </form>
    </body>
</html>
