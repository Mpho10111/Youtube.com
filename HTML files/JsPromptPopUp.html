<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Prompt Pop up Box</title>
    </head>
    <body>
        <script type="text/javascript">
            var name= prompt("Please enter your name", " ")
            if(name!=null && name!= " "){
                document.write("Hello" +" " +name)
            }
        </script>
    </body>
</html>
