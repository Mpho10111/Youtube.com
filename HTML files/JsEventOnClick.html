<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <script type="text/javascript">
            function sayHello(){
                document.write("Hello World");
            }
        </script>
    </head>
    <body>
        <p>Click the following button and see the result</p>
        <input type="button" onclick="sayHello()" value="Say Hello"/>
    </body>
</html>
