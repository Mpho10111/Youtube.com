<html>
    <head>
        <title> JavaScript Confirm Pop up Box</title>
    </head>
    <body>
        <script type="text/javascript">
            var name= confirm("press a button")
            if (name==true){
                document.write("you pressed ok")
            }
            else{
                document.write("you pressed cancel")
            }
        </script>
    </body>
</html>
