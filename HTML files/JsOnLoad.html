<!DOCTYPE html>
<html>
    <head>
        <title> Example of onLoad Event Handler</title>
        <script type="text/javascript">
            function hello(){
                alert("Hello there...\nThis is an example of onLoad.");
            }
        </script>
    </head>
    <body onLoad="hello()">
        <h3>Example of onLoad Event Handler</h3>

    </body>
</html>
