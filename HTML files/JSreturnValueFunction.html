<html>
<head>
<script type="text/javascript">
  function concatenate(first, last) {
    var full = first + " " + last;
    return full;
  }

  function secondFunction() {
    var result = concatenate('Zara', 'Ali');
    document.write(result);
  }
</script>
</head>
<body>
  <input type="button" onclick="secondFunction()" value="Call Function">
</body>
</html>
