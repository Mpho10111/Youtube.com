<!DOCTYPE html>
<html>
    <head>
        <script type="text/javascript">
            function goodbye(){
                alert("Thanks for visiting!");
            }
        </script>
    </head>
    <body onUnLoad="goodbye()">
        <h3>
            Example of onUnLoad event handler
        </h3>
        Look what happens when you try to leave this page...
    </body>
</html>
